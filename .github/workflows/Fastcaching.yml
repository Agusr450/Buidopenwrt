name: Build Custom ImmortalWrt for Samsung J500G

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      target_board:
        description: 'Pilih Target Arsitektur / Board'
        required: true
        default: 'armvirt-armv7'
        type: choice
        options:
          - armvirt-armv7
          - armsr-armv8

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget swig libelf-dev \
            libxml-parser-perl libgmp-dev libmpc-dev libmpfr-dev curl python3-pip ccache
          sudo apt-get clean

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git immortalwrt

      - name: Restore OpenWrt Caches (dl & ccache)
        uses: actions/cache@v4
        with:
          path: |
            immortalwrt/dl
            immortalwrt/.ccache
          key: immortalwrt-cache-${{ runner.os }}-${{ inputs.target_board }}-${{ hashFiles('packages.txt') }}
          restore-keys: |
            immortalwrt-cache-${{ runner.os }}-${{ inputs.target_board }}-
            immortalwrt-cache-${{ runner.os }}-

      - name: Update Feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Target Architecture & Inject Packages
        run: |
          cd immortalwrt
          
          # Pengkondisian Target berdasarkan pilihan di GitHub Actions
          if [ "${{ github.event.inputs.target_board }}" == "armsr-armv8" ]; then
            echo "Memilih target: armsr / armv8"
            echo "CONFIG_TARGET_armsr=y" >> .config
            echo "CONFIG_TARGET_armsr_armv8=y" >> .config
          else
            echo "Memilih target: armvirt / armv7 (32-bit)"
            echo "CONFIG_TARGET_armvirt=y" >> .config
            echo "CONFIG_TARGET_armvirt_32=y" >> .config
          fi
          
          # Aktifkan Ccache
          echo "CONFIG_CCACHE=y" >> .config
          
          # Paket LuCI Web UI bawaan ImmortalWrt
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
          
          # Format Filesystem Rootfs (ext4)
          echo "CONFIG_TARGET_ROOTFS_EXT4_FILESYSTEM=y" >> .config

          # Membaca daftar paket dari packages.txt di root repository
          if [ -f "../packages.txt" ]; then
            echo "Memasukkan paket kustom dari packages.txt..."
            while IFS= read -r pkg || [ -n "$pkg" ]; do
              pkg=$(echo "$pkg" | tr -d '\r' | xargs)
              if [ -z "$pkg" ] || [[ "$pkg" == \#* ]]; then
                continue
              fi
              echo "CONFIG_PACKAGE_$pkg=y" >> .config
              echo "-> Ditambahkan: $pkg"
            done < ../packages.txt
          else
            echo "Peringatan: File packages.txt tidak ditemukan!"
          fi
          
          make defconfig

      - name: Set Up Ccache Size Limit
        run: |
          cd immortalwrt
          ccache -M 2G
          ccache -s

      - name: Download Package Sources
        run: |
          cd immortalwrt
          make download -j8

      - name: Build ImmortalWrt Firmware
        run: |
          cd immortalwrt
          export CCACHE_DIR="$PWD/.ccache"
          make -j$(nproc) || make -j1 V=s

      - name: Package into boot.img (Odin Flashable)
        run: |
          echo "=== DEBUG: Mengecek file di root repository ==="
          ls -la
          
          echo "=== DEBUG: Mencari file kernel di folder bin/targets ==="
          find immortalwrt/bin/targets/ -type f || true

          mkdir -p output_img
          
          KERNEL_PATH=$(find immortalwrt/bin/targets/ -type f \( -name "*Image*" -o -name "*vmlinux*" -o -name "*zImage*" \) ! -name "*.sig" | head -n 1)
          
          echo "Path Kernel terpilih: $KERNEL_PATH"

          if [ -f "$KERNEL_PATH" ] && [ -f "j500g.dtb" ]; then
            echo "Mengunduh tool mkbootimg resmi..."
            git clone https://android.googlesource.com/platform/system/tools/mkbootimg --depth 1
            
            echo "Membuat boot.img kustom dengan file dtb Anda..."
            python3 mkbootimg/mkbootimg.py \
              --kernel "$KERNEL_PATH" \
              --dtb j500g.dtb \
              --base 0x80000000 \
              --kernel_offset 0x00008000 \
              --ramdisk_offset 0x02000000 \
              --tags_offset 0x01000000 \
              --pagesize 2048 \
              -o output_img/boot-j500g-immortalwrt.img
            echo "Berhasil membuat boot.img!"
          else
            echo "Peringatan: Kernel atau j500g.dtb tidak lengkap!"
            if [ ! -f "j500g.dtb" ]; then
              echo "-> File 'j500g.dtb' TIDAK ditemukan di root repository."
            fi
          fi
          
          cp -r immortalwrt/bin/targets/*/*/* output_img/ || true

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ inputs.target_board }}-j500g-firmware
          path: output_img/
