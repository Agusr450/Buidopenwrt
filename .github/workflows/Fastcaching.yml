name: Build Custom ImmortalWrt armsr-armv8 (IMG.XZ)

on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget swig libelf-dev \
            libxml-parser-perl libgmp-dev libmpc-dev libmpfr-dev curl python3-pip ccache xz-utils
          sudo apt-get clean

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git immortalwrt

      - name: Restore OpenWrt Caches (dl & ccache)
        uses: actions/cache@v4
        with:
          path: |
            immortalwrt/dl
            immortalwrt/.ccache
          key: immortalwrt-cache-armsr-armv8-${{ hashFiles('packages.txt') }}
          restore-keys: |
            immortalwrt-cache-armsr-armv8-
            immortalwrt-cache-

      - name: Update Feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Target Architecture & Inject Packages
        run: |
          cd immortalwrt
          
          # Mengunci target ke armsr / armv8 (64-bit)
          echo "CONFIG_TARGET_armsr=y" >> .config
          echo "CONFIG_TARGET_armsr_armv8=y" >> .config
          
          # Aktifkan Ccache
          echo "CONFIG_CCACHE=y" >> .config
          
          # Paket LuCI Web UI bawaan ImmortalWrt
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config

          # Membaca daftar paket dari packages.txt di root repository
          if [ -f "../packages.txt" ]; then
            echo "Memasukkan paket kustom dari packages.txt..."
            while IFS= read -r pkg || [ -n "$pkg" ]; do
              pkg=$(echo "$pkg" | tr -d '\r' | xargs)
              if [ -z "$pkg" ] || [[ "$pkg" == \#* ]]; then
                continue
              fi
              echo "CONFIG_PACKAGE_$pkg=y" >> .config
              echo "-> Ditambahkan: $pkg"
            done < ../packages.txt
          else
            echo "Peringatan: File packages.txt tidak ditemukan!"
          fi
          
          make defconfig

      - name: Set Up Ccache Size Limit
        run: |
          cd immortalwrt
          ccache -M 2G
          ccache -s

      - name: Download Package Sources
        run: |
          cd immortalwrt
          make download -j8

      - name: Build ImmortalWrt Firmware
        run: |
          cd immortalwrt
          export CCACHE_DIR="$PWD/.ccache"
          make -j$(nproc) || make -j1 V=s

      - name: Package into boot.img & Compress to img.xz
        run: |
          echo "=== DEBUG: Mengecek file di root repository ==="
          ls -la

          mkdir -p output_img
          
          # 1. Membuat boot.img kustom menggunakan dtb Anda
          KERNEL_PATH=$(find immortalwrt/bin/targets/ -type f \( -name "*Image*" -o -name "*vmlinux*" -o -name "*zImage*" \) ! -name "*.sig" | head -n 1)
          
          if [ -f "$KERNEL_PATH" ] && [ -f "j500g.dtb" ]; then
            echo "Mengunduh tool mkbootimg resmi..."
            git clone https://android.googlesource.com/platform/system/tools/mkbootimg --depth 1
            
            echo "Membuat boot.img kustom..."
            python3 mkbootimg/mkbootimg.py \
              --kernel "$KERNEL_PATH" \
              --dtb j500g.dtb \
              --base 0x80000000 \
              --kernel_offset 0x00008000 \
              --ramdisk_offset 0x02000000 \
              --tags_offset 0x01000000 \
              --pagesize 2048 \
              -o output_img/boot-j500g-armsr-armv8.img
          fi

          # 2. Menyalin file image utama dari target armsr
          cp -r immortalwrt/bin/targets/*/*/* output_img/ || true

          echo "=== Mengompresi file .img menjadi .img.xz ==="
          # Mengubah semua file .img di folder output menjadi format .img.xz secara otomatis
          for img_file in output_img/*.img; do
            if [ -f "$img_file" ]; then
              echo "Mengompresi: $(basename "$img_file")..."
              xz -T0 -z "$img_file"
            fi
          done
          
          # Juga kompres boot.img kustom jika ingin berbentuk .img.xz
          if [ -f "output_img/boot-j500g-armsr-armv8.img" ]; then
            xz -T0 -z output_img/boot-j500g-armsr-armv8.img
          fi

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-armsr-armv8-j500g-xz-firmware
          path: output_img/
