name: Build Custom ImmortalWrt for Samsung J500G

on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget swig libelf-dev \
            libxml-parser-perl libgmp-dev libmpc-dev libmpfr-dev curl python3-pip
          sudo apt-get clean

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git immortalwrt

      - name: Update Feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Target Architecture & Inject Packages
        run: |
          cd immortalwrt
          
          # Target ARMv7 / armvirt untuk MSM8916
          echo "CONFIG_TARGET_armvirt=y" >> .config
          echo "CONFIG_TARGET_armvirt_32=y" >> .config
          
          # Paket LuCI Web UI bawaan ImmortalWrt
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
          
          # Format Filesystem Rootfs (ext4)
          echo "CONFIG_TARGET_ROOTFS_EXT4_FILESYSTEM=y" >> .config

          # Membaca daftar paket dari packages.txt di root repository
          if [ -f "../packages.txt" ]; then
            echo "Memasukkan paket kustom dari packages.txt..."
            while IFS= read -r pkg || [ -n "$pkg" ]; do
              pkg=$(echo "$pkg" | tr -d '\r' | xargs)
              if [ -z "$pkg" ] || [[ "$pkg" == \#* ]]; then
                continue
              fi
              echo "CONFIG_PACKAGE_$pkg=y" >> .config
              echo "-> Ditambahkan: $pkg"
            done < ../packages.txt
          else
            echo "Peringatan: File packages.txt tidak ditemukan!"
          fi
          
          make defconfig

      - name: Download Package Sources
        run: |
          cd immortalwrt
          make download -j8

      - name: Build ImmortalWrt Firmware
        run: |
          cd immortalwrt
          make -j$(nproc) || make -j1 V=s

      - name: Package into boot.img (Odin Flashable)
        run: |
          mkdir -p output_img
          KERNEL_PATH=$(find immortalwrt/bin/targets/ -name "Image" -o -name "vmlinux" | head -n 1)
          
          if [ -f "$KERNEL_PATH" ] && [ -f "j500g.dtb" ]; then
            echo "Mengunduh tool mkbootimg resmi..."
            git clone https://android.googlesource.com/platform/system/tools/mkbootimg --depth 1
            
            echo "Membuat boot.img kustom dengan file dtb Anda..."
            python3 mkbootimg/mkbootimg.py \
              --kernel "$KERNEL_PATH" \
              --dtb j500g.dtb \
              --base 0x80000000 \
              --kernel_offset 0x00008000 \
              --ramdisk_offset 0x02000000 \
              --tags_offset 0x01000000 \
              --pagesize 2048 \
              -o output_img/boot-j500g-immortalwrt.img
          else
            echo "Gagal membuat boot.img: Kernel atau j500g.dtb tidak ditemukan."
          fi
          
          # Menyimpan seluruh file output target sebagai cadangan
          cp -r immortalwrt/bin/targets/*/*/* output_img/ || true

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-j500g-custom-firmware
          path: output_img/
